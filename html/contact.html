<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Gabriel Carlo Zagala</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-logo" title="Home">
      <i class="fa-solid fa-code"></i>
    </a>
    <div class="nav-links">
      <a href="about.html">about</a>
      <a href="index.html">portfolio</a>
      <a href="contact.html">contact</a>
    </div>
  </nav>

  <!-- CONTACT -->
  <main class="page-main contact-main">
    <div class="contact-left">
      <h1 class="page-title">contact<span class="dot">.</span></h1>
      <p>Get in touch with me via social media or send me an email.</p>

      <div class="contact-links">
        <a href="#" class="contact-item facebook">
          <i class="fa-brands fa-facebook"></i>
          <span>Facebook</span>
        </a>
        <a href="#" class="contact-item gmail">
          <i class="fa-solid fa-phone"></i>
          <span>0916-674-4636</span>
        </a>
        <a href="#" class="contact-item linkedin">
          <i class="fa-brands fa-linkedin"></i> 
          <span>LinkedIn</span>
        </a>
        <a href="#" class="contact-item github">
          <i class="fa-brands fa-github"></i>
          <span>GitHub</span>
        </a>
      </div>
    </div>

    <div class="contact-right">
      <h2 class="form-title">Send me an email</h2>
      <div class="form-group">
        <label>Name</label>
        <input type="text" placeholder="Your name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="Your email">
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea placeholder="Your message"></textarea>
      </div>
      <button class="send-btn">Send email</button>
    </div>
  </main>

  <footer class="footer">
    <span>&copy; 2026 Gabriel Carlo Zagala</span>
    <div class="footer-icons">
      <a href="#" title="Facebook"><i class="fa-brands fa-facebook"></i></a>
      <a href="#" title="GitHub"><i class="fa-brands fa-github"></i></a>
      <a href="#" title="Gmail"><i class="fa-brands fa-linkedin"></i></a>
    </div>
  </footer>

  <script>
    // Active nav link detection
    const current = window.location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('.nav-links a').forEach(link => {
      if (link.getAttribute('href') === current) link.classList.add('active');
    });

    // Entrance animations
    const nl = document.querySelector('.navbar');
    const cl = document.querySelector('.contact-left');
    const cr = document.querySelector('.contact-right');
    const ft = document.querySelector('.footer');

    document.body.style.overflowY = 'hidden';

    nl.style.cssText = 'opacity:0; transform:translateY(-100%); transition:none';
    cl.style.cssText = 'opacity:0; transform:translateX(-100vw); transition:none';
    cr.style.cssText = 'opacity:0; transform:translateX(100vw); transition:none';
    ft.style.cssText = 'opacity:0; transform:translateY(100%); transition:none';

    window.addEventListener('load', () => {
      setTimeout(() => {
        nl.style.cssText = 'opacity:1; transform:translateY(0); transition: opacity 0.6s ease, transform 0.6s ease';
      }, 100);
      setTimeout(() => {
        cl.style.cssText = 'opacity:1; transform:translateX(0); transition: opacity 0.4s ease, transform 0.4s ease';
        cr.style.cssText = 'opacity:1; transform:translateX(0); transition: opacity 0.4s ease, transform 0.4s ease';
      }, 400);
      setTimeout(() => {
        ft.style.cssText = 'opacity:1; transform:translateY(0); transition: opacity 0.5s ease, transform 0.5s ease';
      }, 700);
      setTimeout(() => {
        document.body.style.overflowY = '';
      }, 1300);
    });
  </script>
</body>
</html>
